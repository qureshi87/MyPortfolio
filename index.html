<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Jaleel Qurashi - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: #0b0f19; color: #f1f5f9; line-height: 1.7; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .logo span { color: #38bdf8; }
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav ul li a { text-decoration: none; color: #94a3b8; font-weight: 500; font-size: 0.95rem; transition: color 0.3s; }
        nav ul li a:hover { color: #38bdf8; }
        .hero { min-height: 90vh; display: flex; align-items: center; justify-content: space-between; padding: 0 8%; background: radial-gradient(circle at 70% 30%, #1e1b4b 0%, #0b0f19 70%); gap: 40px; }
        .hero-content { flex: 1; }
        .hero-content h3 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 10px; font-weight: 600; }
        .hero-content h1 { font-size: 2.8rem; font-weight: 700; margin-bottom: 15px; color: #fff; line-height: 1.2; }
        .hero-content p { font-size: 1.05rem; color: #94a3b8; margin-bottom: 30px; }
        .hero-img-container { flex: 1; display: flex; justify-content: center; align-items: center; }
        .profile-pic { width: 270px; height: 270px; border-radius: 50%; object-fit: cover; border: 4px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); animation: floatImage 4s ease-in-out infinite; display: block; }
        .hero-btns { display: flex; gap: 15px; }
        .btn { padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: all 0.3s ease; }
        .primary-btn { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0b0f19; }
        .secondary-btn { border: 2px solid #334155; color: #f1f5f9; background: transparent; }
        .section { padding: 80px 8%; text-align: center; }
        .section h2 { font-size: 2.3rem; margin-bottom: 15px; color: #fff; position: relative; display: inline-block; }
        .section h2::after { content: ''; position: absolute; width: 50%; height: 3px; background: #38bdf8; bottom: -8px; left: 25%; border-radius: 2px; }
        .section-subtitle { color: #94a3b8; margin-bottom: 50px; font-size: 1.05rem; }
        .bg-alt { background-color: #0f172a; }
        .about-card { max-width: 800px; margin: 0 auto; background: #111827; padding: 40px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); text-align: left; position: relative; }
        .about-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #38bdf8; }
        .about-card p { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 15px; }
        .skills-grid, .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; margin-top: 20px; }
        .skill-card, .project-card { background: #111827; padding: 35px 25px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); text-align: left; transition: 0.4s; }
        .skill-card:hover, .project-card:hover { transform: translateY(-8px); border-color: #38bdf8; }
        .skill-card i { font-size: 2.5rem; color: #38bdf8; margin-bottom: 20px; }
        .skill-card h3, .project-card h3 { color: #fff; margin-bottom: 10px; font-size: 1.25rem; }
        .skill-card p, .project-card p { color: #94a3b8; font-size: 0.95rem; }
        .project-card { text-align: center; }
        .contact-container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 30px; }
        .contact-item { background: #111827; padding: 25px 35px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; gap: 15px; }
        .contact-item i { font-size: 1.8rem; color: #38bdf8; }
        .contact-info-text h4 { color: #fff; font-size: 0.95rem; margin-bottom: 3px; }
        .contact-info-text p, .contact-info-text a { color: #94a3b8; font-size: 1rem; text-decoration: none; }
        .contact-info-text a:hover { color: #38bdf8; }
        footer { text-align: center; padding: 30px; background: #07090f; color: #64748b; font-size: 0.9rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes floatImage { 0% { transform: translateY(0); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0); } }
        @media(max-width: 900px) { .hero { flex-direction: column-reverse; text-align: center; padding: 60px 5%; } .hero-btns { justify-content: center; } .hero-content h1 { font-size: 2.2rem; } .profile-pic { width: 220px; height: 220px; } nav ul { display: none; } }
    </style>
</head>

        <div class="logo">Jaleel<span>.</span>Creative</div>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>

                <li><a href="#projects">Portfolio</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">

            <h1>Muhammad Jaleel Qurashi</h1>
            <p>Elevating Visual Identities & Streamlining Digital Operations through Advanced Graphic Design & Corporate Data Mastery.</p>
            <div class="hero-btns">
                <a href="#projects" class="btn primary-btn">Explore Portfolio</a>
                <a href="#contact" class="btn secondary-btn">Get In Touch</a>
            </div>
        </div>
